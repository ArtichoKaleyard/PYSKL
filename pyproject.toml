[project]
name = "pyskl-modern-env"
version = "0.1.0"
description = "Modern uv environment for running PYSKL experiments on CUDA 12.8."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy<2",
  "torch==2.7.*",
  "torchvision==0.22.*",
  "torchaudio==2.7.*",
  "mmcv",
  "mmengine>=0.10,<1",
  "mmdet>=3.2,<3.3",
  "mmpose>=1.3,<1.4",
  "mmaction2>=1.2,<1.3",
  "decord>=0.6.0",
  "fvcore",
  "matplotlib",
  "moviepy",
  "opencv-python",
  "pymemcache",
  "scipy",
  "tqdm",
  "requests>=2.33.1",
]

[tool.uv]
package = false
build-constraint-dependencies = [
  "setuptools<81",
]
no-build-isolation-package = ["mmcv"]
extra-build-dependencies = { mmcv = ["setuptools<81", "wheel", "ninja", "packaging", "psutil"], chumpy = ["pip"] }
extra-build-variables = { mmcv = { MMCV_WITH_OPS = "1", CUDA_HOME = "/usr/local/cuda-12.8" } }

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
mmcv = { path = "../OpenMMLab/third_party/mmcv", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
  "ninja>=1.13.0",
  "packaging>=26.0",
  "pip>=25.0",
  "psutil>=7.2.2",
  "setuptools<81",
  "wheel>=0.46.3",
]
